<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <style>
        :root {
            color: #192a3a;
            background: #eef5ef;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #eef5ef 0%, #d9ebdf 55%, #f6e7c9 100%);
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            border-bottom: 6px solid #d66a45;
            max-width: 720px;
            padding: 48px 36px;
            text-align: center;
        }

        h1 {
            font-size: clamp(3rem, 9vw, 6rem);
            font-weight: 400;
            letter-spacing: 0;
            line-height: 1;
            margin: 0;
        }

        p {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 1.125rem;
            margin: 24px 0 0;
        }

        .status {
            color: #35614d;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .security-note {
            color: #4b5f6a;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<main>
    <p aria-live="polite" class="status" role="status">Signed in</p>
    <h1>Hello, World!</h1>
    <p>A Spring Boot application is running.</p>
    <p class="security-note">Your session is protected.</p>
</main>
</body>
</html>

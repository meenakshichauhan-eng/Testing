<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Hello, World!</title>
    <style>
        :root {
            color: #192a3a;
            background: #eef5ef;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #eef5ef 0%, #d9ebdf 55%, #f6e7c9 100%);
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            border-bottom: 6px solid #d66a45;
            max-width: 360px;
            padding: 40px 32px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0;
            margin: 0 0 8px;
        }

        p, label, input, button {
            font-family: "Trebuchet MS", sans-serif;
        }

        p {
            margin: 0 0 28px;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            font-size: 0.95rem;
            gap: 6px;
        }

        input, button {
            box-sizing: border-box;
            font-size: 1rem;
            min-height: 44px;
            width: 100%;
        }

        input {
            border: 1px solid #78907f;
            border-radius: 4px;
            padding: 8px 10px;
        }

        button {
            background: #192a3a;
            border: 0;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #d66a45;
        }
    </style>
</head>
<body>
<main>
    <h1>Sign in</h1>
    <p>Use your account to continue.</p>
    <form action="/login" method="post">
        <label>Username
            <input autocomplete="username" name="username" required type="text">
        </label>
        <label>Password
            <input autocomplete="current-password" name="password" required type="password">
        </label>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>

name: Notify Atlassian on PR Merge

# Requires a repository secret named ATLASSIAN_WEBHOOK_URL containing the
# Atlassian Automation Incoming Webhook URL.
# Add it under Settings → Secrets and variables → Actions.

on:
  pull_request:
    types: [closed]

jobs:
  notify-atlassian:
    # Only fire for merged PRs whose description has the "Documentation"
    # checkbox checked, e.g. "- [x] Documentation".
    # To gate on a label instead (or in addition), replace/extend this
    # condition with:
    #   contains(github.event.pull_request.labels.*.name, 'documentation')
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.body, '[x] Documentation')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Send PR payload to Atlassian Automation Webhook
        run: |
          http_status=$(curl -s -o response.json -w "%{http_code}" -X POST "${{ secrets.ATLASSIAN_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Atlassian-Token: ${{ secrets.ATLASSIAN_WEBHOOK_SECRET }}" \
            -d '{
              "pull_request": {
                "html_url": "${{ github.event.pull_request.html_url }}",
                "title": "${{ github.event.pull_request.title }}",
                "body": ${{ toJSON(github.event.pull_request.body) }},
                "merged": ${{ github.event.pull_request.merged }},
                "number": ${{ github.event.pull_request.number }},
                "user": {
                  "login": "${{ github.event.pull_request.user.login }}"
                },
                "base": {
                  "ref": "${{ github.event.pull_request.base.ref }}"
                },
                "head": {
                  "ref": "${{ github.event.pull_request.head.ref }}"
                }
              },
              "action": "${{ github.event.action }}",
              "repository": {
                "full_name": "${{ github.repository }}"
              }
            }')

          echo "Webhook response status: $http_status"
          echo "Webhook response body:"
          cat response.json

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Atlassian webhook call failed with HTTP status $http_status"
            exit 1
          fi
